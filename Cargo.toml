[workspace]
resolver = "2"
members = [
    "crates/emotes",
    "crates/mpv-frames",
    "crates/perch",
    "crates/settings",
    "crates/streamlink",
    "crates/twitch-api",
    "crates/twitch-chat",
]
# The crates under `vendor/` are patched dependencies, not members. They have
# to stay out of `--workspace` or `cargo fmt --all --check` and `cargo clippy
# --workspace --all-targets -- -D warnings` would start policing 100k lines of
# somebody else's code, and CI would go red on their style rather than ours.
exclude = [
    "vendor/gpui-pre",
    "vendor/gpui-pre-apple",
    "vendor/gpui-pre-macos",
    "vendor/gpui-pre-windows",
]

[workspace.package]
# One version for the whole workspace, inherited by every crate.
#
# It used to be per-crate, and the six internals never moved off 0.1.0 while
# `perch` was tagged twice — which would be harmless bookkeeping except that
# `env!("CARGO_PKG_VERSION")` expands to the version of the crate being
# compiled. `twitch-chat` builds the chat-history `User-Agent` from it, so every
# request introduced itself to a stranger's server as `perch/0.1.0` through both
# releases. Inheriting means there is one number to bump and nowhere for it to
# drift; a test in `perch` holds that `User-Agent` to this version.
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/puckzxz/perch"
# None of these are meant for crates.io: `perch` is an application, and the six
# crates under it are its internals rather than libraries anyone should depend
# on. Saying so here is what stops a stray `cargo publish` from being possible.
publish = false

# Shared dependencies, declared once. A crate says `futures.workspace = true`
# rather than naming a version, so the seven crates cannot drift onto seven
# subtly different versions or feature sets of the same thing.
[workspace.dependencies]
futures = "0.3"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Without its default features: `oldtime` and `wasmbind` are dead weight here,
# and `clock` is the half that reads the system time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3", features = ["json"] }
# The image crate gpui decodes with, at its version, so one is built: the app
# hands gpui frames of it (`RenderImage`), and `emotes` changes an emote's
# decoded frames for its effects. Each crate names the features it uses.
image = { version = "0.25", default-features = false }

# gpui is vendored in `vendor/gpui-pre` and its Windows and Apple backends.
#
# The video atlas leak was the reason to vendor it at all, on gpui 0.2.2.
# `DirectXAtlas::allocate` looks for free space in *every* atlas texture it has,
# newest first, and `push_texture` rounds each new texture up to at least
# 1024x1024 in *each* dimension separately. So a 1280x936 video frame gets a
# 1280x1024 texture with 64 rows to spare (etagere rounds the 936 shelf to 960),
# the next chat emote is packed into that strip, and the texture's
# `live_atlas_keys` never falls back to zero - so `remove` never frees it.
# `RenderImage::new` mints a fresh id per frame, so this pinned one 5 MiB
# texture for every emote inserted: 43.7 GB of committed memory over five hours,
# 54% of the machine's entire commit charge, against a 5.6 GB working set that
# made it look like a 6 GB problem in Task Manager.
#
# Twelve fixes have been carried, every hunk tagged `PERCH PATCH`, and each keeps
# the number the rest of the tree calls it by. gpui-pre 0.3.12 has six of them
# itself: 2 (`remove` hands a tile's space back to the allocator), 3 (an upload
# refuses a source slice too short for its region), 4 (nothing is drawn from a
# scene that outlived its device), 6 (the render target is released exactly
# once), 8 (a text element does not truncate the runs its next measure reuses)
# and 10 (`start_window_move` on macOS). What is carried now:
#
#  1. A texture created oversized is marked dedicated to the one image it was
#     sized for, and skipped when scanning for room. That is the 43.7 GB.
#     In gpui-pre-windows and gpui-pre-apple.
#  5. `PlatformAtlas::update` and `Window::update_image` - overwrite a tile's
#     pixels in place. `get_or_insert_with` is insert-once, so without this a
#     video frame can only reach the GPU by minting a new key, which means a
#     texture built and destroyed every frame. The shared atlas state refuses
#     an update at another size, and the DirectX backend does the upload. NOT
#     upstream; this is the one invention here.
#  7. A frame drawn after the pointer has left the window hit-tests nothing.
#     Windows reports the leave only as the window's `hovered` flag, with no
#     mouse event, so the last position stayed hit and a sidebar row (or any
#     `.hover()` style) stayed lit until the pointer came back. Not upstream.
#  9. The Mac backend enables gpui-pre-apple's `runtime_shaders` feature,
#     so Perch builds with the macOS SDK alone and compiles Metal shaders
#     when a window opens. It also enables `font-kit` for Core Text.
# 11. A macOS floating panel stays visible and tracks pointer input while
#     another app has focus. Its AppKit setup lives in gpui-pre-macos and its
#     hover state uses the same hit-test rule as fix 7 in gpui-pre.
# 12. `App::hide_cursor_until_mouse_moves`: the platform's call, made public.
#     gpui-pre has no `CursorStyle::None`, which a player used to hide a
#     pointer left still on its picture, and otherwise hides the cursor only
#     itself, on a key press.
#
# `scripts/verify-vendor.sh` downloads each crate from crates.io and verifies
# that applying its patch recreates the vendored tree, and that each fix is
# still in it rather than merely commented.
#
# gpui-pre is a weekly snapshot of Zed's gpui, published to crates.io by
# gpui-component's maintainer, and gpui-component pins one snapshot exactly.
# Moving to another is deliberate: vendor the new tarballs pristine, apply the
# fixes, then switch.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

# Release codegen with symbols, for profilers.
#
# A separate profile rather than `debug = true` on `release` itself, because
# every CI run and every tag builds `--release`: turning debug info on there
# would slow all of them down to serve a thing nobody does on a build machine.
# `inherits` means the code generated is the same code that ships, which is the
# only part a profile has to get right — a profile of a differently-optimised
# binary is a profile of a different program.
#
#     cargo build --profile profiling -p perch
#     samply record target/profiling/perch.exe <channel>     (needs elevation)
[profile.profiling]
inherits = "release"
debug = true
