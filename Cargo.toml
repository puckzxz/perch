[workspace]
resolver = "2"
members = [
    "crates/emotes",
    "crates/mpv-frames",
    "crates/perch",
    "crates/settings",
    "crates/streamlink",
    "crates/twitch-api",
    "crates/twitch-chat",
]

[workspace.package]
# One version for the whole workspace, inherited by every crate.
#
# It used to be per-crate, and the six internals never moved off 0.1.0 while
# `perch` was tagged twice — which would be harmless bookkeeping except that
# `env!("CARGO_PKG_VERSION")` expands to the version of the crate being
# compiled. `twitch-chat` builds the chat-history `User-Agent` from it, so every
# request introduced itself to a stranger's server as `perch/0.1.0` through both
# releases. Inheriting means there is one number to bump and nowhere for it to
# drift; a test in `perch` holds that `User-Agent` to this version.
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/puckzxz/perch"
# None of these are meant for crates.io: `perch` is an application, and the six
# crates under it are its internals rather than libraries anyone should depend
# on. Saying so here is what stops a stray `cargo publish` from being possible.
publish = false

[workspace.dependencies]
libloading = "0.8"
thiserror = "2"

# Release codegen with symbols, for profilers.
#
# A separate profile rather than `debug = true` on `release` itself, because
# every CI run and every tag builds `--release`: turning debug info on there
# would slow all of them down to serve a thing nobody does on a build machine.
# `inherits` means the code generated is the same code that ships, which is the
# only part a profile has to get right — a profile of a differently-optimised
# binary is a profile of a different program.
#
#     cargo build --profile profiling -p perch
#     samply record target/profiling/perch.exe <channel>     (needs elevation)
[profile.profiling]
inherits = "release"
debug = true
