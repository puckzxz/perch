[workspace]
resolver = "2"
members = [
    "crates/emotes",
    "crates/mpv-frames",
    "crates/nativetwitch",
    "crates/settings",
    "crates/streamlink",
    "crates/twitch-api",
    "crates/twitch-chat",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
libloading = "0.8"
thiserror = "2"
