name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A run takes long enough that queueing pushes behind each other is pure
# latency. The newest push is the only one anybody is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Free here, and it turns "a test failed" into something actionable without
  # having to push a commit that only exists to add a backtrace.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    # This was Windows-only, and the reason given was true at the time:
    # diagnostics.rs redirected the process's stderr through `SetStdHandle` and
    # had no other branch, so `perch` genuinely did not compile anywhere else.
    # It has a `dup2` branch beside it now.
    #
    # A matrix rather than a swap, because the interesting part is not that both
    # compile. It is that each leg compiles code the other never sees: where
    # libmpv is looked for, which directory settings and the image cache land
    # in, and whether the secondary modifier is ctrl or cmd are all decided by
    # `cfg` at compile time. A green Windows run says nothing about macOS.
    #
    # No Linux leg. The code has the branches for it — `libmpv.so.2`, the XDG
    # directories — but nobody has run it there, and claiming a platform in CI
    # that no one has watched start up is worse than not claiming it.
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform going red is not a reason to stop learning about the other,
      # and with per-platform `cfg` branches the second result is usually the
      # one worth having.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      # No toolchain action on purpose. rust-toolchain.toml pins the version
      # and names the components, and rustup — preinstalled on the runner —
      # installs both on the first cargo command. Naming a version here too
      # would be the second place for it to drift from, which is the exact way
      # this workflow went red the first time.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      # gpui is a large dependency tree and a cold build is most of this job's
      # wall clock. The cache keys on Cargo.lock, so it only rebuilds when
      # dependencies actually move.
      - uses: Swatinem/rust-cache@v2

      # `vendor/gpui` is gpui 0.2.2 with a four-line fix for an atlas bug that
      # leaked 43.7 GB in five hours. Nothing about that patch is load-bearing
      # at compile time: delete it and the tree still builds, still passes
      # clippy, still passes the tests, and leaks again in production. This is
      # the only thing standing between that and a silent regression, so it
      # runs before anything that takes a minute to fail.
      #
      # On both legs on purpose. The check itself is platform-independent, but
      # the script is not — it picks between `sha256sum` and `shasum`, and
      # leans on `diff` and `sed` behaving the same on GNU and BSD. Running it
      # in both places is what keeps those shims honest.
      - name: Vendored dependencies
        shell: bash
        # `bash script` rather than `./script`: this repo has
        # core.filemode=false, so `git add` records a new file 100644 whatever
        # its mode on disk, and the macOS runner would exit 126 on a file it is
        # not allowed to execute. Windows would pass, because Git Bash ignores
        # the bit — the worst shape for a CI failure to have.
        run: bash scripts/verify-vendor.sh

      # First of the cargo steps because it is the fastest thing that can fail,
      # and because it needs no compilation at all.
      - name: Formatting
        run: cargo fmt --all --check

      # `-D warnings` is the point of running this in CI rather than trusting
      # everyone to look: the tree is clean today, and this is what keeps it
      # that way.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Nothing here needs libmpv, streamlink, a network or a GPU: mpv-frames
      # has no tests, and the streamlink and twitch-api suites are pure parsing
      # over fixture strings. That is a property of how the crates are split,
      # and it is worth not losing — a test that needs a live Twitch session
      # cannot run here.
      - name: Tests
        run: cargo test --workspace --locked

      # The one part of a release that nothing else here exercises. Its failure
      # mode is a bundle that assembles and then will not launch — a plist the
      # system rejects, an icon that did not convert, a signature invalidated by
      # copying the binary in — and the worst time to find that out is while
      # cutting a tag. Run against the debug binary, since what is being checked
      # is the bundling, not the build.
      - name: Bundle
        if: runner.os == 'macOS'
        run: |
          cargo build --locked -p perch
          packaging/macos/bundle.sh target/debug/perch "$RUNNER_TEMP/bundle-check"
          app=$RUNNER_TEMP/bundle-check/perch.app
          test -x "$app/Contents/MacOS/perch"
          test -s "$app/Contents/Resources/perch.icns"
          # `-v` reads the plist back rather than trusting that writing it worked.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = perch
