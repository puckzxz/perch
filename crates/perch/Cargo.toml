[package]
name = "perch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mpv-frames = { path = "../mpv-frames" }
twitch-chat = { path = "../twitch-chat" }
emotes = { path = "../emotes" }
streamlink = { path = "../streamlink" }
twitch-api = { path = "../twitch-api" }
settings = { path = "../settings" }
gpui = "0.2.2"
gpui-component = "0.5.1"
anyhow = "1"
chrono.workspace = true
futures.workspace = true
# Must match gpui's own versions so RenderImage accepts our Frame.
image = { version = "0.25", default-features = false }
smallvec = "1"

# Only for the test that holds a replayed comment's emote tag to what the
# tokenizer reads: the app itself never parses JSON.
[dev-dependencies]
serde_json.workspace = true

# For `dup2` in `diagnostics` and `flock` in `instance`, neither of which has a
# std equivalent.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only for the window's own handle, which `instance` brings forward when a
# later launch hands over and `os_window` keeps a pop-out on top with; gpui
# uses the same crate and does not re-export it.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# Only for go-live notifications (`notifications`): WinRT's toasts, and the
# registry keys that let an unpackaged program show one and be opened by its
# click. Both at the versions gpui already builds, so neither brings a crate
# of its own into the build; only the toast's two features are new to it.
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications"] }
windows-registry = "0.5"

# Only to stamp the icon onto the .exe; see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
