[package]
name = "perch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mpv-frames = { path = "../mpv-frames" }
twitch-chat = { path = "../twitch-chat" }
emotes = { path = "../emotes" }
streamlink = { path = "../streamlink" }
twitch-api = { path = "../twitch-api" }
settings = { path = "../settings" }
gpui = "0.2.2"
gpui-component = "0.5.1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
# Must match gpui's own versions so RenderImage accepts our Frame.
image = { version = "0.25", default-features = false }
smallvec = "1"

# Only for `dup2` in `diagnostics`, which has no std equivalent.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only to stamp the icon onto the .exe; see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
