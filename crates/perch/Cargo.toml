[package]
name = "perch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mpv-frames = { path = "../mpv-frames" }
twitch-chat = { path = "../twitch-chat" }
emotes = { path = "../emotes" }
streamlink = { path = "../streamlink" }
twitch-api = { path = "../twitch-api" }
settings = { path = "../settings" }
# gpui-pre is a snapshot of Zed's gpui (this one zed@d2a4fb6), the only form
# in which anything after 0.2.2 reaches crates.io. Each platform's backend is
# a crate of its own, behind `gpui_platform`, whose `application()` starts an
# app. All three are pinned exactly and move together: gpui-component names
# one snapshot with `=`, and `vendor/gpui-pre*` is that snapshot, patched (the
# root `Cargo.toml` says how).
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-component = "=0.10.0"
anyhow = "1"
chrono.workspace = true
futures.workspace = true
# Must match gpui's own versions so RenderImage accepts our Frame.
image.workspace = true
smallvec = "1"

# Only for the test that holds a replayed comment's emote tag to what the
# tokenizer reads: the app itself never parses JSON.
[dev-dependencies]
serde_json.workspace = true

# For `dup2` in `diagnostics` and `flock` in `instance`, neither of which has a
# std equivalent.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only for the window's own handle, which `instance` brings forward when a
# later launch hands over and `os_window` keeps a pop-out on top with; gpui
# uses the same crate and does not re-export it.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# Only for go-live notifications (`notifications`): WinRT's toasts, and the
# registry keys that let an unpackaged program show one and be opened by its
# click. Both at the versions gpui already builds, so neither brings a crate
# of its own into the build; only the toast's two features are new to it.
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"] }
windows-registry = "0.6"

# Only to stamp the icon onto the .exe; see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
